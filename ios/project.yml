# Xcode project definition — regenerate SwoleClicker.xcodeproj with `xcodegen` (brew install xcodegen) in this folder.
# The game itself lives in SwoleClicker/Web/index.html, produced by `python3 tools/build.py ios` from the repo's index.html.
name: SwoleClicker
options:
  bundleIdPrefix: com.calamborn
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: AD8HRS5Z7D
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  SwoleClicker:
    type: application
    platform: iOS
    sources:
      - path: SwoleClicker
        excludes: ["Web/**"]
      - path: SwoleClicker/Web     # copied into the app as a folder (Web/index.html)
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.calamborn.swoleclicker
        PRODUCT_NAME: SwoleClicker
        TARGETED_DEVICE_FAMILY: "1"          # iPhone only (runs in compatibility mode on iPad)
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Info.plist
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Swole Clicker
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.casual-games
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
